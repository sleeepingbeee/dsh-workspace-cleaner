name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Two supported ways to authenticate, in priority order:
    #   1. a repository secret NPM_TOKEN (granular access token with 2FA bypass)
    #   2. npm trusted publishing (OIDC) — needs no secret, but the package must
    #      already exist on the registry and the trusted publisher must point at
    #      this repository + this workflow file.
    # Secrets cannot be used in an `if`, so the token is exposed through `env`.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm version
        run: |
          npm --version
          # Trusted publishing (tokenless OIDC publish) needs npm >= 11.5.1.
          node -e "const [a,b,c]=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" || npm install --global npm@latest
          npm --version

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      - name: Publish with NPM_TOKEN
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with trusted publishing (OIDC)
        if: env.NPM_TOKEN == ''
        run: |
          echo "No NPM_TOKEN configured; publishing via npm trusted publishing (OIDC)."
          echo "This requires https://www.npmjs.com/package/dsh-workspace-cleaner to exist"
          echo "with a trusted publisher pointing at ${{ github.repository }} / release.yml."
          npm publish --provenance --access public
